
name: PHP CI Application

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_sqlite

      - name: Copy .env file
        run: php -r "file_exists('.env') || copy('.env.example', '.env');"

      - name: Install Dependencies
        run: composer install -q --no-ansi --no-interaction --no-progress --prefer-dist

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Lint code with Pint
        run: ./vendor/bin/pint --test

      - name: Ensure SQLite database exists
        run: touch database/database.sqlite

      - name: Apply migrations and seed demo data
        run: php artisan migrate --seed --force

      - name: Generate OpenAPI documentation
        run: php artisan l5-swagger:generate

      - name: Verify route cache
        run: php artisan route:cache && php artisan route:clear

      - name: Run Application Tests
        env:
          SENTRY_LARAVEL_DSN: ""
        run: php artisan test

      - name: Demonstrate GitHub Secrets
        env:
          MY_SUPER_SECRET_KEY: ${{ secrets.MY_SUPER_SECRET_KEY }}
        run: test -z "$MY_SUPER_SECRET_KEY" || echo "Demo secret is configured"

